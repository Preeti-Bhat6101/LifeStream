<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Login - LifeStream</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: var(--dark-green);
      }
      .login-container {
        width: 100%;
        max-width: 400px;
        background: var(--white);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-footer {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
      .login-footer a {
        color: var(--dark-green);
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>LifeStream Portal</h1>
        <p>Blood Bank Management System</p>
      </div>
      <form id="login-form">
        <label for="username">Username</label
        ><input type="text" id="username" required />
        <label for="password">Password</label
        ><input type="password" id="password" required />
        <button type="submit" style="width: 100%">Login</button>
      </form>
      <p id="login-message" class="form-message" style="text-align: center"></p>
      <div class="login-footer">
        <p><a href="/home.html">Return to Homepage</a></p>
      </div>
    </div>
    <script>
      const loginForm = document.getElementById("login-form");
      const message = document.getElementById("login-message");
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        try {
          // All logins go to the same, single endpoint
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const result = await response.json();
          if (response.ok) {
            message.textContent = "Login successful! Redirecting...";
            message.style.color = "green";
            // Everyone redirects to the same dynamic dashboard
            setTimeout(() => {
              window.location.href = "/index.html";
            }, 1000);
          } else {
            message.textContent = result.message;
            message.style.color = "red";
          }
        } catch (error) {
          message.textContent = "An error occurred.";
          message.style.color = "red";
        }
      });
    </script>
  </body>
</html>
